# marginal config. `marginal config` prints what a run would use and where each
# value came from. A ./marginal.toml, then --config, then a CLI flag override it.

mode = "agent"             # who writes the comments: agent = your coding agent,
                           # api = this tool calls a model itself (needs a key)
model = "claude-fable-5"   # the commenter, in api mode
provider = "auto"          # anthropic | openrouter | auto (anthropic, then openrouter)
# effort = "high"          # low | medium | high | xhigh | max; unset = provider default

# The editing pass that trims each comment before it posts.
critic = "auto"            # agent = the placing subagent (no model call; the default
                           # under mode = agent), api = this tool on critic_model, off
critic_model = "claude-opus-5"
critic_effort = "medium"
min_words = 20             # the band a comment should land in; the pass only ever cuts
max_words = 60
word_ceiling = 80          # nothing posts above this

web_search = false         # let the commenter look things up while it reads
suggestions = false        # allow suggested edits (tracked changes) as well as comments
reconcile_anchors = false  # ask a model to place a quote no rule could (a model call)

[prompts]                  # bump the version rather than editing in place
commenter = "prompts/commenter-v2.md"
critique = "prompts/critique-v1.md"
respond = "prompts/respond-v1.md"
