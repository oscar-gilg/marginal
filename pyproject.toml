[project]
name = "marginal"
version = "0.5.0"
description = "Let a model read a Google Doc and leave native anchored comments in it."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oscar Gilg" }]
keywords = ["google-docs", "comments", "review", "claude", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup",
]
# One dependency on purpose. The CDP client needs a websocket; everything else —
# the Google APIs, the model calls, the OAuth flow — goes over urllib, so
# `uvx marginal` resolves in about a second and there is no wheel to build.
dependencies = [
    "websocket-client>=1.7",
]

# `publish` needs Pillow to shrink and frame figures before they are uploaded.
# It stays an extra because the markdown most people publish has no figures in it,
# and a text-only publish must not cost a wheel build on a machine that will never
# render one. `publish.py` imports PIL lazily and says this name when it is absent.
[project.optional-dependencies]
publish = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/oscar-gilg/marginal"
Source = "https://github.com/oscar-gilg/marginal"
Issues = "https://github.com/oscar-gilg/marginal/issues"

[project.scripts]
marginal = "marginal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal"]

# Ship the prompts inside the package. Without this an installed copy has no
# prompts at all and every review fails on FileNotFoundError.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "marginal/prompts"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
